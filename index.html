let busyOps = new Set();
async function runLocked(key, fn){
  if(busyOps.has(key)) return;
  busyOps.add(key);
  try { return await fn(); } finally { busyOps.delete(key); }
}

const $ = id => document.getElementById(id);
const money = n => 'R$ ' + Number(n || 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){ const t = $('toast'); t.textContent = s; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 3400); }

function showAuthMsg(text, type){
  const box = $('authMsg');
  if(!text){ box.classList.add('hidden'); return; }
  box.textContent = text;
  box.className = 'auth-msg ' + (type || 'err');
  box.classList.remove('hidden');
}

function setAuthMode(m){
  authMode = m;
  showAuthMsg('', '');
  $('authTitle').textContent = m === 'login' ? 'Entre na sua liga' : 'Crie sua conta de Manager';
  $('authSubmit').textContent = m === 'login' ? 'Entrar na Liga →' : 'Criar Conta e Entrar →';
  $('loginTab').classList.toggle('active', m === 'login');
  $('signupTab').classList.toggle('active', m === 'signup');
}

async function submitAuth(){
  if(!window.supabase?.createClient){ showAuthMsg('Não foi possível carregar o serviço de conexão. Verifique sua internet e atualize a página.', 'err'); return; }
  if(!sb){ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  const email = $('email').value.trim();
  const password = $('password').value;
  showAuthMsg('', '');

  if(!email || !password){
    showAuthMsg('Preencha o e-mail e a senha para continuar.', 'err');
    return;
  }
  if(password.length < 6){
    showAuthMsg('A senha deve ter pelo menos 6 caracteres.', 'err');
    return;
  }

  const btn = $('authSubmit');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = authMode === 'login' ? 'Entrando...' : 'Criando conta...';

  try {
    let res;
    if(authMode === 'signup'){
      res = await sb.auth.signUp({ email, password });
      if(res.error) throw res.error;
      if(!res.data.session){
        // Tenta login imediato caso o projeto não exija confirmação
        const loginTry = await sb.auth.signInWithPassword({ email, password });
        if(loginTry.data?.session){
          res = loginTry;
        } else {
          showAuthMsg('Conta criada! Se o Supabase pedir confirmação, verifique seu e-mail e depois clique em Entrar.', 'ok');
          setAuthMode('login');
          return;
        }
      }
    } else {
      res = await sb.auth.signInWithPassword({ email, password });
      if(res.error) throw res.error;
    }

    user = res.data.user || res.data.session?.user;
    if(user){
      try { await sb.from('profiles').upsert({ id: user.id, email: user.email }); } catch(_) {}
      await boot();
    }
  } catch(e){
    let msg = e?.message || 'Erro ao autenticar.';
    if(msg.includes('Invalid login credentials')) msg = 'E-mail ou senha incorretos. Se ainda não tem conta, toque em "Criar Conta".';
    if(msg.includes('User already registered')) msg = 'Este e-mail já está cadastrado. Toque em "Entrar" para acessar.';
    if(msg.includes('Email not confirmed')) msg = 'Confirme seu e-mail na caixa de entrada antes de entrar.';
    showAuthMsg(msg, 'err');
    toast(msg);
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}


function showRecoveryMode(){
  $('authScreen').classList.remove('hidden'); $('app').classList.add('hidden');
  $('authNormalFields').classList.add('hidden'); $('authRecovery').classList.remove('hidden');
  $('authTitle').textContent = 'Redefinir senha';
  showAuthMsg('Link de recuperação validado. Defina sua nova senha abaixo.', 'ok');
}
async function updatePassword(){
  const password = $('newPassword').value;
  const confirm = $('confirmNewPassword').value;
  if(password.length < 6) return showAuthMsg('A nova senha precisa ter pelo menos 6 caracteres.', 'err');
  if(password !== confirm) return showAuthMsg('As senhas não coincidem.', 'err');
  const btn = $('updatePasswordBtn'); btn.disabled = true; btn.textContent = 'Salvando...';
  try{
    const { error } = await sb.auth.updateUser({ password });
    if(error) throw error;
    $('newPassword').value = ''; $('confirmNewPassword').value = '';
    $('authRecovery').classList.add('hidden'); $('authNormalFields').classList.remove('hidden');
    showAuthMsg('Senha atualizada com sucesso. Entrando na sua liga...', 'ok');
    await boot();
  }catch(error){ showAuthMsg('Não foi possível atualizar a senha: ' + (error?.message || 'erro inesperado'), 'err'); }
  finally{ btn.disabled = false; btn.textContent = 'Salvar nova senha'; }
}

async function sendPasswordReset(){
  if(!window.supabase?.createClient){ showAuthMsg('Serviço de conexão indisponível. Atualize a página e tente novamente.', 'err'); return; }
  if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const email = $('email').value.trim();
  if(!email){ showAuthMsg('Digite seu e-mail no campo acima para receber o link de recuperação.', 'err'); $('email').focus(); return; }
  const btn = $('forgotPasswordBtn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    if(error) throw error;
    showAuthMsg('Se o endereço estiver cadastrado, você receberá um link para redefinir sua senha. Confira também o spam.', 'ok');
  }catch(error){ showAuthMsg('Não foi possível solicitar a recuperação: ' + (error?.message || 'erro inesperado'), 'err'); }
  finally{ btn.disabled = false; btn.textContent = 'Esqueci minha senha'; }
}

async function logout(){
  if(sb) await sb.auth.signOut();
  location.reload();
}

async function boot(){
  const { data, error } = await sb.auth.getSession();
  if(error || !data.session) return;
  user = data.session.user;
  $('authScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('avatar').textContent = (user.email || 'M').slice(0, 1).toUpperCase();
  await loadMemberships();
}

async function loadMemberships(){
  const { data, error } = await sb.from('league_members').select('league_id,role,leagues(*)').eq('user_id', user.id);
  if(error){ toast('Erro ao carregar ligas: ' + error.message); return; }
  if(!data || !data.length){
    $('noLeague').classList.remove('hidden');
    $('leagueContent').classList.add('hidden');
    return;
  }
  league = data[0].leagues;
  membership = data[0];
  await loadAll();
}

async function createLeague(){
  const name = $('newLeagueName').value.trim();
  if(!name) return toast('Digite o nome da liga.');
  if(!user?.id) return toast('Sua sessão expirou. Entre novamente.');
  const code = crypto.randomUUID().replace(/-/g, '').slice(0, 8).toUpperCase();
  const { data, error } = await sb.from('leagues').insert({ name, invite_code: code, created_by: user.id }).select().single();
  if(error) return toast('Não foi possível criar a liga: ' + error.message);
  const memberResult = await sb.from('league_members').insert({ league_id: data.id, user_id: user.id, role: 'admin' });
  if(memberResult.error){
    console.error(memberResult.error);
    await sb.from('leagues').delete().eq('id', data.id);
    return toast('A liga foi criada, mas não foi possível registrar você como administrador. Verifique as políticas do banco e tente novamente.');
  }
  const seasonResult = await sb.from('seasons').insert({ league_id: data.id, name: 'Temporada 1', status: 'active' });
  if(seasonResult.error){
    console.error(seasonResult.error);
    return toast('Liga criada, mas a temporada inicial não foi criada: ' + seasonResult.error.message + '. Crie a temporada pelo painel após verificar o banco.');
  }
  league = data;
  membership = { role: 'admin' };
  await loadAll();
}

async function joinLeague(){
  const code = $('inviteCode').value.trim().toUpperCase();
  if(!code) return toast('Informe o código de convite.');
  const { error } = await sb.rpc('join_league_by_code', { p_code: code });
  if(error) return toast(error.message);
  await loadMemberships();
  toast('Você entrou na liga!');
}

async function loadAll(){
  const id = league.id;
  const q = await Promise.all([
    sb.from('leagues').select('*').eq('id', id).single(),
    sb.from('seasons').select('*').eq('league_id', id).order('created_at', { ascending: false }),
    sb.from('clubs').select('*').eq('league_id', id).order('name'),
    sb.from('players').select('*').eq('league_id', id).order('overall', { ascending: false }),
    sb.from('matches').select('*').eq('league_id', id).order('match_order', { ascending: true }),
    sb.from('match_events').select('*').eq('league_id', id),
    sb.from('transfers').select('*').eq('league_id', id).order('created_at', { ascending: false }),
    sb.from('transfer_proposals').select('*').eq('league_id', id).order('created_at', { ascending: false }),
    sb.from('ledger_entries').select('*').eq('league_id', id).order('created_at', { ascending: false }),
    sb.from('league_members').select('role,user_id,profiles(email)').eq('league_id', id),
    sb.from('league_news').select('*').eq('league_id', id).order('created_at', { ascending: false }).limit(30)
  ]);
  for(let i = 0; i < q.length; i++){
    if(q[i].error){ console.warn('Falha ao carregar dados da liga:', q[i].error); toast('Falha ao carregar dados: ' + q[i].error.message); }
  }
  if(q[0].data) league = q[0].data;
  seasons = q[1].data || [];
  season = seasons.find(s => s.status === 'active') || seasons[0] || null;
  clubs = q[2].data || [];
  players = q[3].data || [];
  matches = q[4].data || [];
  matchEvents = q[5].data || [];
  transfers = q[6].data || [];
  proposals = q[7].data || [];
  ledger = q[8].data || [];
  members = q[9].data || [];
  news = q[10].data || [];
  render();
  $('noLeague').classList.add('hidden');
  $('leagueContent').classList.remove('hidden');
  subscribe();
}

function subscribe(){
  if(channels.length) return;
  ['clubs','players','matches','match_events','transfers','transfer_proposals','ledger_entries','seasons','league_news','leagues'].forEach(table => {
    const filter = table === 'leagues' ? 'id=eq.' + league.id : 'league_id=eq.' + league.id;
    const ch = sb.channel('rt-' + table + '-' + league.id).on('postgres_changes', { event: '*', schema: 'public', table, filter }, () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => loadAll(), 350); }).subscribe();
    channels.push(ch);
  });
}

function isAdmin(){ return membership?.role === 'admin'; }
function myClubIds(){ return clubs.filter(c => c.owner_user_id === user.id).map(c => c.id); }
function canManageClub(clubId){ return isAdmin() || myClubIds().includes(clubId); }

function statsRows(){
  const played = matches.filter(m => m.season_id === season?.id && m.status === 'played' && m.home_goals !== null);
  return clubs.map(c => {
    const ms = played.filter(m => m.home_club_id === c.id || m.away_club_id === c.id);
    const r = { ...c, j: ms.length, v: 0, e: 0, d: 0, gp: 0, gc: 0 };
    ms.forEach(m => {
      const h = m.home_club_id === c.id;
      const a = h ? m.home_goals : m.away_goals;
      const b = h ? m.away_goals : m.home_goals;
      r.gp += a; r.gc += b;
      if(a > b) r.v++; else if(a === b) r.e++; else r.d++;
    });
    r.pts = r.v * 3 + r.e;
    r.sg = r.gp - r.gc;
    return r;
  }).sort((a, b) => b.pts - a.pts || b.sg - a.sg || b.gp - a.gp);
}

  if(p?.photo_url) return `<img class="pavatar" src="${esc(p.photo_url)}" alt="${esc(p?.name || '')}" onerror="this.outerHTML='<div class=\'pavatar\'>${initials}</div>'">`;
  return `<div class="pavatar">${initials}</div>`;
}
function crest(c){ return `<span class="crest">${esc((c?.name || 'CL').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase())}</span>`; }
                                                 function render(){
  if(!league) return;
  const rows = statsRows();
  const seasonMatches = matches.filter(m => m.season_id === season?.id);
  const playedMatches = seasonMatches.filter(m => m.status === 'played' && m.home_goals !== null);
  const schedMatches = seasonMatches.filter(m => m.status !== 'played' || m.home_goals === null);

  $('sideLeague').textContent = league.name;
  $('sideSeason').textContent = season?.name || 'Sem temporada';
  $('heroLeague').textContent = league.name;
  $('heroMeta').textContent = `${clubs.length} clubes • ${season?.name || 'Sem temporada'} • Tempo real`;
  $('kClubs').textContent = clubs.length;
  $('kPlayers').textContent = players.length;
  $('kMatches').textContent = playedMatches.length;
  $('kMatchesSub').textContent = `de ${seasonMatches.length} jogos`;
  $('kTransfers').textContent = transfers.length;

  const pendingProps = proposals.filter(pr => pr.status === 'pending' && (isAdmin() || myClubIds().includes(pr.from_club_id)));
  $('notifBadge').textContent = pendingProps.length;
  $('notifBadge').classList.toggle('hidden', pendingProps.length === 0);

function handlePhotoFile(input){
  const file = input.files?.[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ input.value = ''; return toast('Selecione um arquivo de imagem válido.'); }
  if(file.size > 8 * 1024 * 1024){ input.value = ''; return toast('A imagem deve ter no máximo 8 MB.'); }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 140; canvas.height = 140;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, 140, 140);
      $('pPhotoUrl').value = canvas.toDataURL('image/jpeg', 0.75);
      toast('Foto carregada e otimizada!');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

}

  const pid = $('boPlayerId').value;
  const buyerId = $('boBuyerClub').value;
  const { error } = await sb.rpc('buyout_player', { p_league_id: league.id, p_season_id: season?.id || null, p_player_id: pid, p_buyer_club_id: buyerId });
  if(error) return toast(error.message);
  closeModal('buyoutModal');
  toast('Multa paga! Jogador contratado imediatamente.');
  await loadAll();
}); }

function openOfferModal(targetId){
  const availClubs = isAdmin() ? clubs : clubs.filter(c => c.owner_user_id === user.id);
  if(!availClubs.length) return toast('Você precisa ter um clube vinculado para propor negociações.');
  $('ofBuyerClub').innerHTML = availClubs.map(c => `<option value="${c.id}">${esc(c.name)} (${money(c.balance)})</option>`).join('');
  $('ofTargetPlayer').innerHTML = players.filter(p => p.club_id && !availClubs.some(c => c.id === p.club_id)).map(p => `<option value="${p.id}" ${p.id === targetId ? 'selected' : ''}>${esc(p.name)} (${p.overall}) — ${esc(clubs.find(c => c.id === p.club_id)?.name || '')}</option>`).join('');
  if(!$('ofTargetPlayer').options.length) return toast('Não há jogadores de outros clubes disponíveis para negociação.');
  $('ofCash').value = 0;
  refreshOfferPlayers();
  openModal('offerModal');
}
function refreshOfferPlayers(){
  const buyerId = $('ofBuyerClub').value;
  const currentTarget = $('ofTargetPlayer').value;
  $('ofTargetPlayer').innerHTML = players.filter(p => p.club_id && p.club_id !== buyerId).map(p => `<option value="${p.id}" ${p.id === currentTarget ? 'selected' : ''}>${esc(p.name)} (${p.overall}) — ${esc(clubs.find(c => c.id === p.club_id)?.name || '')}</option>`).join('');
  $('ofSwapPlayer').innerHTML = '<option value="">-- Nenhum jogador (apenas dinheiro) --</option>' + players.filter(p => p.club_id === buyerId).map(p => `<option value="${p.id}">${esc(p.name)} (OVR ${p.overall})</option>`).join('');
}
async function sendProposal(){
  const buyerId = $('ofBuyerClub').value, targetId = $('ofTargetPlayer').value, swapId = $('ofSwapPlayer').value || null, cash = Number($('ofCash').value);
  const target = players.find(p => p.id === targetId);
  const buyerClub = clubs.find(c => c.id === buyerId);
  const offered = swapId ? players.find(p => p.id === swapId) : null;
  if(!buyerClub || (!isAdmin() && buyerClub.owner_user_id !== user.id)) return toast('Você não tem permissão para negociar por este clube.');
  if(!target || !target.club_id) return toast('Selecione um jogador válido.');
  if(target.club_id === buyerId) return toast('Este jogador já é do seu clube.');
  if(!Number.isFinite(cash) || cash < 0) return toast('Informe uma oferta em dinheiro válida.');
  if(swapId && (!offered || offered.club_id !== buyerId)) return toast('O jogador oferecido precisa pertencer ao clube comprador.');
  if(!swapId && cash <= 0) return toast('Ofereça um jogador para troca, dinheiro, ou ambos.');
  const { error } = await sb.from('transfer_proposals').insert({ league_id: league.id, season_id: season?.id || null, from_club_id: target.club_id, to_club_id: buyerId, target_player_id: targetId, offered_player_id: swapId, cash_offer: cash });
  if(error) return toast(error.message);
  closeModal('offerModal'); toast('Proposta enviada! O clube vendedor foi notificado.'); await loadAll();
}

function openNotifications(){
  const myIds = myClubIds();
  const list = proposals.filter(pr => isAdmin() || myIds.includes(pr.from_club_id) || myIds.includes(pr.to_club_id));
  $('notifList').innerHTML = list.map(pr => {
    const buyer = clubs.find(c => c.id === pr.to_club_id), seller = clubs.find(c => c.id === pr.from_club_id);
    const target = players.find(p => p.id === pr.target_player_id), offered = players.find(p => p.id === pr.offered_player_id);
    const canAnswer = pr.status === 'pending' && (isAdmin() || myIds.includes(pr.from_club_id));
    return `<div class="newsitem">
      <div style="display:flex;justify-content:space-between"><span class="tag ${pr.status === 'pending' ? 'gold' : pr.status === 'accepted' ? 'green' : 'red'}">${pr.status === 'pending' ? 'PENDENTE' : pr.status === 'accepted' ? 'ACEITA' : 'RECUSADA'}</span><span class="sub">${new Date(pr.created_at).toLocaleDateString('pt-BR')}</span></div>
      <h4>${esc(buyer?.name || '?')} quer ${esc(target?.name || '?')} (do ${esc(seller?.name || '?')})</h4>
      <p>Oferta: ${offered ? `<b>${esc(offered.name)}</b> (OVR ${offered.overall})` : 'Sem troca de atleta'} ${Number(pr.cash_offer) > 0 ? `+ <b>${money(pr.cash_offer)}</b>` : ''}</p>
      ${canAnswer ? `<div style="display:flex;gap:8px;margin-top:9px"><button class="btn sm" onclick="answerProposal('${pr.id}',true)">✅ Aceitar</button><button class="btn danger sm" onclick="answerProposal('${pr.id}',false)">❌ Recusar</button></div>` : ''}
    </div>`;
  }).join('') || '<div class="empty">Nenhuma proposta no momento.</div>';
  openModal('notifModal');
}
async function answerProposal(id, accept){ return runLocked('prop-' + id, async () => {
  const { error } = await sb.rpc('respond_transfer_proposal', { p_proposal_id: id, p_accept: accept });
  if(error) return toast(error.message);
  closeModal('notifModal'); toast(accept ? 'Negociação aceita e concluída!' : 'Proposta recusada.'); await loadAll();
}); }

function openDrawModal(){
  if(!isAdmin()) return toast('Apenas o ADM pode sortear os jogos.');
  if(!season) return toast('Crie uma temporada primeiro.');
  openModal('drawModal');
}
async function runFixtureDraw(){ return runLocked('draw', async () => {
  const dbl = $('drawFormat').value === 'true';
  const { error } = await sb.rpc('generate_season_fixtures', { p_league_id: league.id, p_season_id: season.id, p_double_round: dbl });
  if(error) return toast(error.message);
  closeModal('drawModal'); toast('Tabela sorteada com sucesso!'); await loadAll();
}); }
  function openMatchModal(matchId){
  if(!isAdmin()) return toast('Apenas o ADM pode lançar placares.');
  if(!season) return toast('Crie uma temporada primeiro.');
  const m = matches.find(x => x.id === matchId);
  $('mEditId').value = m?.id || '';
  $('mHome').innerHTML = clubs.map(c => `<option value="${c.id}" ${m?.home_club_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  $('mAway').innerHTML = clubs.map(c => `<option value="${c.id}" ${m?.away_club_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  if(!m && clubs.length > 1) $('mAway').selectedIndex = 1;
  $('mHG').value = m?.home_goals ?? 0;
  $('mAG').value = m?.away_goals ?? 0;
  $('mRound').value = m?.round_number || 1;
  $('matchEventsContainer').innerHTML = '';
  if(m){
    matchEvents.filter(e => e.match_id === m.id).forEach(e => addEventRow(e.event_type, e));
  }
  openModal('matchModal');
}

function addEventRow(type, existing = null){
  const homeId = $('mHome').value, awayId = $('mAway').value;
  const matchPlayers = players.filter(p => p.club_id === homeId || p.club_id === awayId);
  const pool = matchPlayers.length ? matchPlayers : players;
  const opts = pool.map(p => {
    const cl = clubs.find(c => c.id === p.club_id);
    return `<option value="${p.id}" ${existing?.player_id === p.id ? 'selected' : ''}>${esc(p.name)} (${esc(cl?.name || 'Livre')})</option>`;
  }).join('');
  const assistOpts = '<option value="">-- Sem assistência --</option>' + pool.map(p => {
    const cl = clubs.find(c => c.id === p.club_id);
    return `<option value="${p.id}" ${existing?.assist_player_id === p.id ? 'selected' : ''}>👟 ${esc(p.name)} (${esc(cl?.name || 'Livre')})</option>`;
  }).join('');
  const label = type === 'goal' ? '⚽ Gol' : type === 'yellow_card' ? '🟨 Amarelo' : '🟥 Vermelho';
  const row = document.createElement('div');
  row.className = 'evrow';
  row.dataset.type = type;
  row.innerHTML = `
    <div><span class="tag ${type === 'goal' ? 'green' : type === 'yellow_card' ? 'gold' : 'red'}" style="margin-bottom:4px">${label}</span><select class="ev-player" style="width:100%;padding:7px;border-radius:8px;background:#090e1c;color:#fff;border:1px solid var(--border)">${opts}</select></div>
    <div>${type === 'goal' ? `<span class="sub" style="display:block;margin-bottom:4px">Assistência</span><select class="ev-assist" style="width:100%;padding:7px;border-radius:8px;background:#090e1c;color:#fff;border:1px solid var(--border)">${assistOpts}</select>` : '<span class="sub">Cartão disciplinar</span>'}</div>
    <button type="button" class="btn danger sm" onclick="this.parentElement.remove()">✕</button>
  `;
  $('matchEventsContainer').appendChild(row);
}

async function saveMatch(){ return runLocked('save-match', async () => {
  if(!isAdmin()) return toast('Apenas o ADM pode salvar placares.');
  const matchId = $('mEditId').value || null;
  const homeId = $('mHome').value, awayId = $('mAway').value;
  const hg = Number($('mHG').value), ag = Number($('mAG').value);
  const roundNum = Number($('mRound').value) || 1;
  if(!homeId || !awayId || homeId === awayId) return toast('Selecione dois clubes diferentes.');
  if(!Number.isInteger(hg) || hg < 0 || !Number.isInteger(ag) || ag < 0) return toast('Informe placares válidos (0 ou maior).');

  const events = Array.from(document.querySelectorAll('#matchEventsContainer .evrow')).map(row => {
    const pid = row.querySelector('.ev-player')?.value || null;
    const aid = row.querySelector('.ev-assist')?.value || null;
    const pl = players.find(p => p.id === pid);
    return {
      event_type: row.dataset.type,
      player_id: pid,
      assist_player_id: row.dataset.type === 'goal' ? aid : null,
      club_id: pl?.club_id || homeId
    };
  }).filter(e => e.player_id);

  const { error } = await sb.rpc('record_match_with_events', {
    p_league_id: league.id,
    p_season_id: season.id,
    p_match_id: matchId,
    p_home_club_id: homeId,
    p_away_club_id: awayId,
    p_home_goals: hg,
    p_away_goals: ag,
    p_round_number: roundNum,
    p_events: events
  });
  if(error) return toast(error.message);
  closeModal('matchModal');
  toast('Placar e eventos salvos com sucesso!');
  await loadAll();
}); }

async function addLedgerEntry(){ return runLocked('ledger', async () => {
  if(!isAdmin()) return toast('Apenas o ADM pode lançar movimentações.');
  const clubId = $('fClub').value;
  const entryType = $('fType').value;
  const desc = $('fDesc').value.trim();
  const amount = Number($('fAmount').value);
  const club = clubs.find(c => c.id === clubId);
  if(!club) return toast('Selecione um clube.');
  if(!desc) return toast('Informe a descrição do lançamento.');
  if(!Number.isFinite(amount) || amount <= 0) return toast('Informe um valor maior que zero.');

  const { error: ledErr } = await sb.from('ledger_entries').insert({
    league_id: league.id,
    season_id: season?.id || null,
    club_id: clubId,
    entry_type: entryType,
    description: desc,
    amount
  });
  if(ledErr) return toast(ledErr.message);

  const newBalance = entryType === 'income' ? Number(club.balance) + amount : Math.max(0, Number(club.balance) - amount);
  const { error: clubErr } = await sb.from('clubs').update({ balance: newBalance }).eq('id', clubId);
  if(clubErr) return toast(clubErr.message);

  $('fDesc').value = '';
  $('fAmount').value = '';
  toast('Lançamento financeiro registrado!');
  await loadAll();
}); }

async function closeSeason(){ return runLocked('close-season', async () => {
  if(!isAdmin()) return toast('Apenas o ADM pode encerrar a temporada.');
  if(!season) return toast('Nenhuma temporada ativa encontrada.');
  if(!confirm(`Encerrar "${season.name}" e distribuir as premiações de Campeão, Artilheiro e Assistências?`)) return;

  const rows = statsRows();
  const champ = rows[0];
  const evSeason = matchEvents.filter(e => e.season_id === season.id && e.event_type === 'goal');
  const goalMap = {}, assistMap = {};
  evSeason.forEach(e => {
    goalMap[e.player_id] = (goalMap[e.player_id] || 0) + 1;
    if(e.assist_player_id) assistMap[e.assist_player_id] = (assistMap[e.assist_player_id] || 0) + 1;
  });
  const topScorer = Object.entries(goalMap).map(([pid, cnt]) => ({ p: players.find(x => x.id === pid), cnt })).filter(x => x.p?.club_id).sort((a, b) => b.cnt - a.cnt)[0];
  const topAssist = Object.entries(assistMap).map(([pid, cnt]) => ({ p: players.find(x => x.id === pid), cnt })).filter(x => x.p?.club_id).sort((a, b) => b.cnt - a.cnt)[0];

  const payouts = [];
  if(champ && Number(league.champion_prize) > 0) payouts.push({ clubId: champ.id, amount: Number(league.champion_prize), desc: `Premiação Campeão (${season.name})` });
  if(topScorer && Number(league.top_scorer_prize) > 0) payouts.push({ clubId: topScorer.p.club_id, amount: Number(league.top_scorer_prize), desc: `Premiação Artilheiro: ${topScorer.p.name} (${season.name})` });
  if(topAssist && Number(league.top_assist_prize) > 0) payouts.push({ clubId: topAssist.p.club_id, amount: Number(league.top_assist_prize), desc: `Premiação Líder Assistências: ${topAssist.p.name} (${season.name})` });

  for(const item of payouts){
    const cl = clubs.find(c => c.id === item.clubId);
    if(!cl) continue;
    await sb.from('clubs').update({ balance: Number(cl.balance) + item.amount }).eq('id', cl.id);
    await sb.from('ledger_entries').insert({ league_id: league.id, season_id: season.id, club_id: cl.id, entry_type: 'income', description: item.desc, amount: item.amount });
  }

  await sb.from('seasons').update({ status: 'finished' }).eq('id', season.id);
  const nextNum = seasons.length + 1;
  await sb.from('seasons').insert({ league_id: league.id, name: `Temporada ${nextNum}`, status: 'active' });
  await sb.from('league_news').insert({
    league_id: league.id,
    category: 'TEMPORADA',
    title: `${season.name} Encerrada!`,
    body: `${champ ? `Campeão: ${champ.name}. ` : ''}Premiações pagas e Temporada ${nextNum} iniciada!`
  });
  toast('Temporada encerrada e premiações distribuídas!');
  await loadAll();
}); }

async function createNewSeason(){ return runLocked('new-season', async () => {
  if(!isAdmin()) return toast('Apenas o ADM pode criar temporadas.');
  const name = ($('newSeasonName')?.value || '').trim() || `Temporada ${seasons.length + 1}`;
  if(season) await sb.from('seasons').update({ status: 'finished' }).eq('id', season.id);
  const { error } = await sb.from('seasons').insert({ league_id: league.id, name, status: 'active' });
  if(error) return toast(error.message);
  if($('newSeasonName')) $('newSeasonName').value = '';
  toast(`${name} iniciada!`);
  await loadAll();
}); }

async function saveLeagueSettings(){ return runLocked('save-cfg', async () => {
  if(!isAdmin()) return toast('Apenas o ADM pode alterar as configurações.');
  const name = $('adminLeagueName').value.trim() || league.name;
  const payload = {
    name,
    goal_bonus: Math.max(0, Number($('cfgGoal').value) || 0),
    assist_bonus: Math.max(0, Number($('cfgAssist').value) || 0),
    yellow_card_fine: Math.max(0, Number($('cfgYellow').value) || 0),
    red_card_fine: Math.max(0, Number($('cfgRed').value) || 0),
    home_stadium_income: Math.max(0, Number($('cfgStadium').value) || 0),
    champion_prize: Math.max(0, Number($('cfgChamp').value) || 0),
    top_scorer_prize: Math.max(0, Number($('cfgScorer').value) || 0),
    top_assist_prize: Math.max(0, Number($('cfgAssistPrize').value) || 0)
  };
  const { error } = await sb.from('leagues').update(payload).eq('id', league.id);
  if(error) return toast(error.message);
  toast('Valores e premiações salvos com sucesso!');
  await loadAll();
}); }

function copyInvite(){
  const code = $('adminInvite').value;
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(code).then(() => toast('Código de convite copiado!')).catch(() => toast('Código: ' + code));
  } else {
    $('adminInvite').select();
    document.execCommand('copy');
    toast('Código de convite copiado!');
  }
}

async function regenerateInvite(){
  if(!isAdmin()) return;
  const code = crypto.randomUUID().replace(/-/g, '').slice(0, 8).toUpperCase();
  const { error } = await sb.from('leagues').update({ invite_code: code }).eq('id', league.id);
  if(error) return toast(error.message);
  toast('Novo código gerado: ' + code);
  await loadAll();
}

window.addEventListener('DOMContentLoaded', async () => {
  if(!window.supabase?.createClient) return;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY') showRecoveryMode();
  });
  await boot();
});
</script>
